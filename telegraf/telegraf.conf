# Configuración de Telegraf para el proyecto TA3.
#
# Telegraf se suscribe al broker EMQX, convierte cada mensaje JSON en un punto
# de datos y lo guarda en InfluxDB (bucket "planta").
#
# Una entrada por variable del motor:
#   temperatura -> measurement "temperatura_motor" (campo temperature_c)
#   vibracion   -> measurement "vibracion_motor"   (campo vibration_mms)
#   consumo     -> measurement "consumo_motor"     (campos current_a y power_kw)
# Todas con las etiquetas machine_id y line, y la hora tomada del mensaje.
#
# Los valores ${...} vienen de las variables de entorno definidas en docker-compose.yml.

[agent]
  interval = "10s"
  flush_interval = "5s"        # escribe en InfluxDB cada 5 s
  omit_hostname = true         # no agrega la etiqueta "host" del contenedor
  skip_processors_after_aggregators = false

# ---------------------------------------------------------------------------
# Entrada: temperatura de carcasa del motor-01
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_BROKER}"]
  topics = ["fabrica/envasado1/motor01/temperatura"]
  qos = 1
  # Sesión persistente: si Telegraf se reinicia, EMQX le guarda los mensajes pendientes
  client_id = "telegraf-ta3-temperatura"
  persistent_session = true
  # No guardar el nombre del tópico como etiqueta (solo machine_id y line)
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "temperatura_motor"
    # Se usa la hora en que el simulador tomó la lectura (UTC), no la hora de llegada
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "machine_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "line"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperature_c"
      type = "float"

# ---------------------------------------------------------------------------
# Entrada: vibración (velocidad RMS) del motor-01
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_BROKER}"]
  topics = ["fabrica/envasado1/motor01/vibracion"]
  qos = 1
  client_id = "telegraf-ta3-vibracion"
  persistent_session = true
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "vibracion_motor"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "machine_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "line"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "vibration_mms"
      type = "float"

# ---------------------------------------------------------------------------
# Entrada: consumo eléctrico (corriente y potencia) del motor-01
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_BROKER}"]
  topics = ["fabrica/envasado1/motor01/consumo"]
  qos = 1
  client_id = "telegraf-ta3-consumo"
  persistent_session = true
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "consumo_motor"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "machine_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "line"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "current_a"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "power_kw"
      type = "float"

# ---------------------------------------------------------------------------
# Salida: InfluxDB 2
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# Proyecto TA3: monitoreo IoT para mantenimiento predictivo (motor-01, envasado-1)
# Arquitectura: Simulador Python -> EMQX -> Telegraf -> InfluxDB 2 -> Grafana
#
# El simulador NO corre en Docker: se ejecuta en la laptop con Python (node/simulador.py).
# Las credenciales se leen desde el archivo .env (ver .env.example).
# Todas las imágenes tienen versión fija para que el proyecto sea reproducible.

name: ta3-iot

services:

  # Broker MQTT. Recibe los mensajes del simulador.
  emqx:
    image: emqx/emqx:5.8.6
    container_name: ta3-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT (simulador, Telegraf, MQTTX)
      - "8083:8083"     # MQTT sobre WebSocket
      - "18083:18083"   # Panel web de administración
    environment:
      - EMQX_NODE__NAME=emqx@127.0.0.1
      - TZ=${TZ}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Base de datos de series de tiempo. Guarda las lecturas.
  influxdb:
    image: influxdb:2.7.11
    container_name: ta3-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"     # API y panel web de InfluxDB
    environment:
      # Configuración inicial automática (solo se aplica la primera vez)
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - TZ=${TZ}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Recolector. Lee los mensajes de EMQX y los escribe en InfluxDB (ver telegraf/telegraf.conf).
  telegraf:
    image: telegraf:1.34.4
    container_name: ta3-telegraf
    restart: unless-stopped
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - MQTT_BROKER=tcp://emqx:1883
      - TZ=${TZ}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      emqx:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # Visualización. Dashboards y alertas.
  grafana:
    image: grafana/grafana:11.6.1
    container_name: ta3-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"     # Panel web de Grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DEFAULT_LOCALE=es-ES
      # Datos para el datasource provisionado (grafana/provisioning/datasources)
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - TZ=${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy

# Volúmenes con nombre: los datos se conservan aunque se apaguen los contenedores.
volumes:
  emqx_data:
  emqx_log:
  influxdb_data:
  influxdb_config:
  grafana_data:
